name: Bundle and Deploy

on:
  push:
    branches:
      - "[0-9]+.[0-9]+/*"
  # Daily rebuild of the stable, languages and NSFW repositories of both app
  # versions (0.9/stable is the default branch), so sources brought in from
  # other repositories (scripts/aggregate.mjs) pick up their updates.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bundle-deploy:
    name: Bundle and Deploy (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      # One at a time: they all publish to the gh-pages branch.
      max-parallel: 1
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'push' && format('["{0}"]', github.ref_name) || '["0.9/stable","0.9/languages","0.9/nsfw","0.8/stable","0.8/languages","0.8/nsfw"]') }}
    env:
      # The branch being built (a scheduled run builds more than one).
      BUILD_REF: ${{ matrix.ref }}
      # Daily and manual runs check every source still works (scripts/stats.mjs);
      # builds from a push carry the last results over.
      STATS_CHECK: ${{ github.event_name != 'push' && '1' || '' }}
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Bundle Extensions
        run: npm run bundle
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          destination_dir: ${{ matrix.ref }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
      # Two branches pushed together deploy at the same time, and the second
      # push to gh-pages is refused; try again once the first is in.
      - name: Wait before trying again
        if: steps.deploy.outcome == 'failure'
        run: sleep $((20 + RANDOM % 40))
      - name: Deploy to GitHub Pages (second try)
        if: steps.deploy.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          destination_dir: ${{ matrix.ref }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
