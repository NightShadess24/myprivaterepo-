name: Bundle and Deploy

on:
  push:
    branches:
      - "[0-9]+.[0-9]+/*"
  # Daily rebuild of both stable repositories (0.9/stable, the default branch,
  # and 0.8/stable), so sources brought in from other repositories
  # (scripts/aggregate.mjs) pick up their updates.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bundle-deploy:
    name: Bundle and Deploy (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      # One at a time: both publish to the gh-pages branch.
      max-parallel: 1
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'push' && format('["{0}"]', github.ref_name) || '["0.9/stable","0.8/stable"]') }}
    env:
      # The branch being built (a scheduled run builds more than one).
      BUILD_REF: ${{ matrix.ref }}
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Bundle Extensions
        run: npm run bundle
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          destination_dir: ${{ matrix.ref }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
